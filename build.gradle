plugins {
    id 'java'
    id 'application'
}

group = 'com.deployagram.demo'
version = '0.0.1-SNAPSHOT'
description = 'deployagram-java-emailer-demo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.deployagram.demo.emailer.EmailerApplication'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.11'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.rest-assured:rest-assured:5.5.6'
    testImplementation 'com.deployagram:deployagram-annotations-junit5:1.0.6'
    testImplementation 'com.deployagram:deployagram-environment:1.0.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
